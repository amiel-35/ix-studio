<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Marrowbay Ferments</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces&amp;family=Inter&amp;display=swap">
<style>
html,body{margin:0;padding:0}
body{width:1800px;height:1200px;position:relative;overflow:hidden;background:#f4efe6}
.bg{position:absolute;left:0px;top:0px;width:990px;height:1200px;object-fit:contain;background:#f4efe6;box-sizing:border-box;}
.shape{position:absolute;left:0px;top:0px;width:990px;height:1200px;overflow:hidden;background:rgba(200,85,61,0.14);box-sizing:border-box;}
.shape::after{content:"";position:absolute;right:-12%;bottom:-18%;width:70%;padding-bottom:70%;border-radius:50%;background:rgba(200,85,61,0.16)}
.blk{position:absolute;left:990px;top:0px;width:810px;height:1200px;padding:76px 76px 185px 76px;background:#f4efe6;box-sizing:border-box;display:flex;flex-direction:column;justify-content:center}
.hl{margin:0;font-family:'Fraunces',Georgia,serif;font-size:69px;line-height:1.05;font-weight:600;text-wrap:balance;color:#c8553d}
.sub{margin:33px 0 0;max-width:34em;font-family:'Inter',system-ui,sans-serif;font-size:46px;line-height:1.3;color:#1e2a24}
.cta{align-self:flex-start;margin:44px 0 0;padding:14px 33px;border:3px solid #1e2a24;font-family:'Inter',system-ui,sans-serif;font-size:38px;font-weight:600;color:#1e2a24}
.sig{margin-top:54px;font-family:'Fraunces',Georgia,serif;font-size:38px;color:#1e2a24}
.slogan{margin:11px 0 0;font-family:'Inter',system-ui,sans-serif;font-size:35px;line-height:1.25;white-space:nowrap;color:#1e2a24}
.blk~.slogan{position:absolute;right:184px;bottom:54px;z-index:2;margin:0;box-sizing:border-box;max-width:603px;height:126px;padding:0 14px;display:flex;align-items:center;text-align:right;font-size:35px;}
.logo{position:absolute;right:54px;bottom:54px;z-index:2;display:block;height:98px;box-sizing:content-box}
.ph{width:98px;border:2px dashed #1e2a24;display:flex;align-items:center;justify-content:center;font-family:'Inter',system-ui,sans-serif;font-size:27px;color:#1e2a24}
</style></head>
<body data-layout="side">
<img class="bg" src="image.png" alt="">
<div class="blk"><h1 class="hl">It&#x27;s tea that got a little wild.</h1><p class="sub">Brewed in a harbour town. Poured anywhere.</p><p class="cta">Find us at the market</p></div>
<div class="logo ph">logo</div>
<p class="slogan">Brewed slowly. Drunk quickly.</p>
</body></html>
